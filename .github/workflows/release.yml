name: Windows release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.0'
          architecture: x64
      - name: Unit and desktop tests (no model download)
        shell: pwsh
        run: python -m unittest discover -s . -p 'test_*.py' -v

  publish:
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.0'
          architecture: x64
      - name: Build portable installer and update
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python build_release.py --tag "$env:RELEASE_TAG" --repository "$env:GITHUB_REPOSITORY" --output-dir dist/release
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed.' }
      - name: Upload all assets to a draft, then publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $release = Get-Content -LiteralPath 'dist/release/release-assets.json' -Raw | ConvertFrom-Json
          if ($release.tag -ne $env:RELEASE_TAG) { throw 'Release manifest tag mismatch.' }
          gh release view "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) { throw 'This release already exists; existing releases will not be overwritten.' }
          $assets = @($release.assets | ForEach-Object { Join-Path 'dist/release' $_ })
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) { throw "Missing release asset: $asset" }
          }
          gh release create "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --verify-tag --draft --title "Local Agent $($release.version)" --notes-file 'dist/release/release-notes.txt'
          if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release.' }
          gh release upload "$env:RELEASE_TAG" @assets --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed; release remains a draft.' }
          gh release edit "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the prepared draft.' }
